services:
  db:
    image: postgres:16
    container_name: judge-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-judge}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - judge_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-judge}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  swagger:
    image: swaggerapi/swagger-ui:latest
    container_name: judge-swagger
    restart: unless-stopped
    ports:
      - "${SWAGGER_PORT:-8081}:8080"
    environment:
      SWAGGER_JSON: /openapi/backendAPI.yaml
    volumes:
      - ../docs:/openapi:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  judge_db_data:
