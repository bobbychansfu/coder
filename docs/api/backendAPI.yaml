openapi: 3.0.3
info:
  title: Judge System API
  version: 1.0.0
servers:
  - url: http://localhost:3000

tags:
  - name: Authentication
    description: Authentication endpoints (/api/auth/*)
  - name: Practice
    description: Practice submission endpoints (/api/practice/*)
  - name: Student
    description: Student endpoints (/api/s/*)
  - name: Instructor
    description: Instructor endpoints (/api/i/*)
  - name: System & Judging
    description: System and judging endpoints
  - name: Internal
    description: Internal transport endpoints

paths:
  /api/auth/cas/login:
    get:
      tags: [Authentication]
      summary: Start CAS login with redirect response
      description: Redirects the browser to the CAS login service.
      parameters:
        - in: query
          name: next
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to CAS login
        "500":
          description: CAS configuration missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
    post:
      tags: [Authentication]
      summary: Start CAS login with JSON response
      description: Returns a CAS redirect URL in JSON for client-driven login flows.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CasLoginStartRequest"
      responses:
        "200":
          description: CAS redirect URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "500":
          description: CAS configuration missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/auth/cas/callback:
    get:
      tags: [Authentication]
      summary: Complete CAS login callback
      description: Validates the CAS ticket with the configured auth backend and redirects into the app.
      parameters:
        - in: query
          name: ticket
          required: true
          schema:
            type: string
        - in: query
          name: next
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the app or back to login with an error

  /api/auth/dev-login:
    post:
      tags: [Authentication]
      summary: Create a dev-mode session
      description: Available only when `AUTH_MODE=dev`. Creates a signed dev session cookie for one of the configured demo users.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevLoginRequest"
      responses:
        "200":
          description: Dev login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevAuthResponse"
        "400":
          description: Invalid request body
        "401":
          description: Demo user not found or role mismatch
        "403":
          description: Dev auth disabled
        "500":
          description: Missing dev auth configuration

  /api/auth/dev-signup:
    post:
      tags: [Authentication]
      summary: Create a dev-mode student account and session
      description: Available only when `AUTH_MODE=dev`. Creates a new student user, then signs them in with a dev session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevSignupRequest"
      responses:
        "201":
          description: Dev signup successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevAuthResponse"
        "400":
          description: Invalid request body
        "403":
          description: Dev signup disabled
        "409":
          description: Computing ID or email already exists
        "500":
          description: Missing dev auth configuration

  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Logout the current user
      responses:
        "200":
          description: Session cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"

  /api/trpc/{trpc}:
    get:
      tags: [Internal]
      summary: tRPC transport endpoint
      description: Internal tRPC HTTP transport used by the frontend client. Query and body formats are tRPC-specific and not modeled as a conventional REST contract.
      parameters:
        - in: path
          name: trpc
          required: true
          schema:
            type: string
      responses:
        "200":
          description: tRPC response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
    post:
      tags: [Internal]
      summary: tRPC transport endpoint
      description: Internal tRPC HTTP transport used by the frontend client. Query and body formats are tRPC-specific and not modeled as a conventional REST contract.
      parameters:
        - in: path
          name: trpc
          required: true
          schema:
            type: string
      responses:
        "200":
          description: tRPC response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/practice/submissions:
    post:
      tags: [Practice]
      summary: Create a practice submission
      description: >
        Students create persisted practice submissions. Instructors can also call this
        endpoint, but receive an ephemeral judged response instead of a persisted record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PracticeSubmissionCreateRequest"
      responses:
        "200":
          description: Submission accepted or judged ephemerally
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PracticeSubmissionCreateResponse"
                  - $ref: "#/components/schemas/PracticeSubmissionPayloadWithPersistence"
        "400":
          description: Invalid JSON body, missing problemId/code, or unsupported language
        "401":
          description: Unauthorized
        "403":
          description: Forbidden for unsupported roles
        "404":
          description: Problem not found
        "500":
          description: Failed to create submission

  /api/practice/submissions/{submissionId}:
    get:
      tags: [Practice]
      summary: Get a persisted practice submission
      parameters:
        - in: path
          name: submissionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Submission record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeSubmissionPayload"
        "401":
          description: Unauthorized
        "403":
          description: Students only
        "404":
          description: Submission not found

  /api/practice/submissions/{submissionId}/stream:
    get:
      tags: [Practice]
      summary: Stream practice submission updates over SSE
      parameters:
        - in: path
          name: submissionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Server-sent events stream for submission status updates
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                connected:
                  value: |
                    event: connected
                    data: {"submissionId":"sub_123","status":"queued"}
        "401":
          description: Unauthorized
        "403":
          description: Students only
        "404":
          description: Submission not found

  /api/s/info:
    get:
      tags: [Student]
      summary: Get summary info for student contests
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/s/profile:
    get:
      tags: [Student]
      summary: Get current user profile details
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/s/update_profile:
    post:
      tags: [Student]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/s/achievements:
    get:
      tags: [Student]
      summary: Get list of user achievements
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/s/achievements/{id}/icon:
    get:
      tags: [Student]
      summary: Get the icon image for a specific achievement
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/*:
              schema:
                type: string
                format: binary

  /api/s/contest/register/{cid}:
    post:
      tags: [Student]
      summary: Register for a specific contest
      parameters:
        - in: path
          name: cid
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/s/contest/unregister/{cid}:
    get:
      tags: [Student]
      summary: Unregister from a contest
      parameters:
        - in: path
          name: cid
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/s/entercontest/{cid}:
    get:
      tags: [Student]
      summary: Enter contest lobby (checks registration status)
      parameters:
        - in: path
          name: cid
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/s/contest/{cid}:
    get:
      tags: [Student]
      summary: Get contest details and problem statuses
      parameters:
        - in: path
          name: cid
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/s/closed/{cid}:
    get:
      tags: [Student]
      summary: Get info for a closed contest
      parameters:
        - in: path
          name: cid
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/s/problem/{cid}/{pid}:
    get:
      tags: [Student]
      summary: Get details for a specific problem
      parameters:
        - in: path
          name: cid
          required: true
          schema:
            type: string
        - in: path
          name: pid
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/s/submit/{cid}/{pid}:
    post:
      tags: [Student]
      summary: Submit code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentSubmitRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/StudentSubmitRequest"
      parameters:
        - in: path
          name: cid
          required: true
          schema:
            type: string
        - in: path
          name: pid
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Missing code or unsupported language
        "401":
          description: Unauthorized
        "403":
          description: Not registered, contest unavailable, contest closed, or instructor/admin submission blocked
        "404":
          description: Contest or problem not found
        "409":
          description: Judge problem mapping missing

  /api/s/submissions/{cid}/{pid}:
    get:
      tags: [Student]
      summary: Get submission history for a specific problem
      parameters:
        - in: path
          name: cid
          required: true
          schema:
            type: string
        - in: path
          name: pid
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/s/allsubmissions:
    get:
      tags: [Student]
      summary: Get all submissions for the current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/s/request_hint:
    post:
      tags: [Student]
      summary: Request an AI-generated hint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HintRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/HintRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/s/hints:
    get:
      tags: [Student]
      summary: Retrieve hint history for a problem
      parameters:
        - in: query
          name: pid
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Missing pid

  /api/i/info:
    get:
      tags: [Instructor]
      summary: Get instructor dashboard summary
      description: Planned instructor endpoint. This contract is kept in Swagger for future implementation and may not yet be fully backed by a Next API route.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/i/contests:
    get:
      tags: [Instructor]
      summary: Get list of all contests for instructor/admin views
      description: Planned instructor endpoint. This contract is kept in Swagger for future implementation and may not yet be fully backed by a Next API route.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/i/contest/create:
    get:
      tags: [Instructor]
      summary: Get data required to render the contest authoring form
      description: Planned instructor endpoint. This contract is kept in Swagger for future implementation and may not yet be fully backed by a Next API route.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
    post:
      tags: [Instructor]
      summary: Create a contest
      description: Planned instructor endpoint. This contract is kept in Swagger for future implementation and may not yet be fully backed by a Next API route.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContestCreateRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/ContestCreateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/i/contest/{cid}:
    get:
      tags: [Instructor]
      summary: Get contest details for editing
      description: Planned instructor endpoint. This contract is kept in Swagger for future implementation and may not yet be fully backed by a Next API route.
      parameters:
        - in: path
          name: cid
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/i/adduser:
    get:
      tags: [Instructor]
      summary: Get form data for adding a new user
      description: Planned instructor endpoint. This contract is kept in Swagger for future implementation and may not yet be fully backed by a Next API route.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
    post:
      tags: [Instructor]
      summary: Add a new user manually
      description: Planned instructor endpoint. This contract is kept in Swagger for future implementation and may not yet be fully backed by a Next API route.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddUserRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/AddUserRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/i/problem/{cid}/{pid}:
    get:
      tags: [Instructor]
      summary: Get problem details for instructor review
      description: Planned instructor endpoint. This contract is kept in Swagger for future implementation and may not yet be fully backed by a Next API route.
      parameters:
        - in: path
          name: cid
          required: true
          schema:
            type: string
        - in: path
          name: pid
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/i/problems/{problemId}:
    patch:
      tags: [Instructor]
      summary: Partially update a problem
      description: >
        Applies a partial update to an instructor-authored problem. This is PATCH semantics,
        not full replacement. Only fields included in the request body are updated. Omitted
        scalar fields remain unchanged, and related collections such as tags, starter codes,
        and examples are only replaced when those keys are explicitly provided.
      parameters:
        - in: path
          name: problemId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProblemPatchRequest"
      responses:
        "200":
          description: Problem updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityUpdateResponse"

  /api/i/contests/{contestId}:
    patch:
      tags: [Instructor]
      summary: Partially update a contest
      description: >
        Applies a partial update to an instructor-managed contest. This is PATCH semantics,
        not full replacement. Only fields included in the request body are updated. Omitted
        fields remain unchanged, and contest problem links are only replaced when
        selectedProblemIds is explicitly provided.
      parameters:
        - in: path
          name: contestId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContestPatchRequest"
      responses:
        "200":
          description: Contest updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityUpdateResponse"

  /api/i/submit/{cid}/{pid}:
    post:
      tags: [Instructor]
      summary: Submit code for an instructor test run
      description: Planned instructor endpoint. This contract is kept in Swagger for future implementation and may not yet be fully backed by a Next API route.
      parameters:
        - in: path
          name: cid
          required: true
          schema:
            type: string
        - in: path
          name: pid
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstructorSubmitRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/InstructorSubmitRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/i/submissions/{cid}/{pid}:
    get:
      tags: [Instructor]
      summary: View student submissions for a problem
      description: Planned instructor endpoint. This contract is kept in Swagger for future implementation and may not yet be fully backed by a Next API route.
      parameters:
        - in: path
          name: cid
          required: true
          schema:
            type: string
        - in: path
          name: pid
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/i/allsubmissions:
    get:
      tags: [Instructor]
      summary: View all submissions globally
      description: Planned instructor endpoint. This contract is kept in Swagger for future implementation and may not yet be fully backed by a Next API route.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/judge-callback:
    post:
      tags: [System & Judging]
      summary: Webhook to receive results from the Judge
      description: >
        Accepts judge callbacks for both contest submissions and persisted practice submissions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JudgeResultRequest"
      responses:
        "200":
          description: Callback accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JudgeCallbackResponse"
        "400":
          description: Missing callback identifiers
        "404":
          description: No matching submission found
        "500":
          description: Internal callback processing error

  /api/m/judge_result:
    post:
      tags: [System & Judging]
      summary: Legacy alias for the judge callback
      description: Alias route that forwards to `/api/judge-callback`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JudgeResultRequest"
      responses:
        "200":
          description: Callback accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JudgeCallbackResponse"
        "400":
          description: Missing callback identifiers
        "404":
          description: No matching submission found
        "500":
          description: Internal callback processing error

  /api/cron/sync-contest-status:
    get:
      tags: [System & Judging]
      summary: Sync contest workflow status with wall-clock time
      description: >
        Protected cron endpoint. Requires `x-cron-secret` header or `secret` query value
        matching `CRON_SECRET`.
      parameters:
        - in: header
          name: x-cron-secret
          required: false
          schema:
            type: string
        - in: query
          name: secret
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Sync completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContestStatusSyncResponse"
        "401":
          description: Unauthorized

  /api/m/scoreboard/{cid}:
    get:
      tags: [System & Judging]
      summary: Get scoreboard data for a contest
      description: Planned system endpoint. This contract is kept in Swagger for future implementation and may not yet be fully backed by a Next API route.
      parameters:
        - in: path
          name: cid
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/m/submissions:
    get:
      tags: [System & Judging]
      summary: Retrieve status for multiple submissions
      description: Planned system endpoint. This contract is kept in Swagger for future implementation and may not yet be fully backed by a Next API route.
      parameters:
        - in: query
          name: sids
          required: false
          description: Submission IDs, often passed as a comma-separated string.
          schema:
            type: string
            example: "123,124,125"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/m/report_ai_hint:
    post:
      tags: [System & Judging]
      summary: Report the result of an AI hint generation job
      description: Planned system endpoint. This contract is kept in Swagger for future implementation and may not yet be fully backed by a Next API route.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportAiHintRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

components:
  schemas:
    OkResponse:
      type: object
      description: Generic OK response wrapper (placeholder)
      properties:
        ok:
          type: boolean
          example: true
        message:
          type: string
          example: OK
        data:
          description: Endpoint-specific payload
          nullable: true
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
            - type: string
            - type: number
            - type: boolean
      required: [ok]

    CasLoginStartRequest:
      type: object
      properties:
        next:
          type: string

    DevLoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [student, instructor, admin]
      required: [email, role]

    DevSignupRequest:
      type: object
      properties:
        name:
          type: string
        computingId:
          type: string
        email:
          type: string
          format: email
        studentNumber:
          type: string
      required: [name, computingId, email]

    DevAuthResponse:
      type: object
      properties:
        message:
          type: string
        user:
          type: object
          properties:
            computingId:
              type: string
            email:
              type: string
              format: email
            role:
              type: string
              enum: [student, instructor, admin]
        expiresInSeconds:
          type: integer
      required: [message, user, expiresInSeconds]

    LogoutResponse:
      type: object
      properties:
        message:
          type: string
          example: Logged out.
      required: [message]

    UpdateProfileRequest:
      type: object
      properties:
        fname:
          type: string
        lname:
          type: string
        nickname:
          type: string
        student_number:
          type: string

    StudentSubmitRequest:
      type: object
      description: >
        Contest submission payload. JSON requests may send `textcode` or `code`.
        Multipart requests may send `filecode` or `textcode`. `connection_id` is optional.
      properties:
        filecode:
          type: string
          format: binary
          description: Uploaded source file for multipart requests
        textcode:
          type: string
          description: Code contents as plain text
        code:
          type: string
          description: Alternate JSON field for code contents
        language:
          type: string
        connection_id:
          type: string
      required: [language]
      oneOf:
        - required: [filecode]
        - required: [textcode]
        - required: [code]

    PracticeSubmissionCreateRequest:
      type: object
      properties:
        problemId:
          type: string
        language:
          type: string
          enum: [cplusplus, java, python, typescript, javascript]
        code:
          type: string
      required: [problemId, language, code]

    PracticeSubmissionTestcase:
      type: object
      properties:
        name:
          type: string
        passed:
          type: boolean
        message:
          type: string
      required: [name, passed, message]

    PracticeSubmissionPayload:
      type: object
      properties:
        submissionId:
          type: string
        status:
          type: string
          enum: [queued, running, done, failed]
        score:
          type: number
          nullable: true
        verdict:
          type: string
          nullable: true
          enum: [accepted, wrong_answer, partial, runtime_error, failed]
        feedback:
          type: string
          nullable: true
        testcases:
          type: array
          items:
            $ref: "#/components/schemas/PracticeSubmissionTestcase"
        judgedBy:
          type: string
          nullable: true
          enum: [gemini, judge]
        updatedAt:
          type: string
          format: date-time
        errorMessage:
          type: string
          nullable: true
      required:
        [submissionId, status, score, verdict, feedback, testcases, judgedBy, updatedAt, errorMessage]

    PracticeSubmissionPayloadWithPersistence:
      allOf:
        - $ref: "#/components/schemas/PracticeSubmissionPayload"
        - type: object
          properties:
            persisted:
              type: boolean
          required: [persisted]

    PracticeSubmissionCreateResponse:
      type: object
      properties:
        submissionId:
          type: string
        status:
          type: string
          enum: [queued]
        persisted:
          type: boolean
          enum: [true]
      required: [submissionId, status, persisted]

    HintRequest:
      type: object
      properties:
        pid:
          type: string
      additionalProperties: true
      required: [pid]

    ContestCreateRequest:
      type: object
      description: Planned contest creation contract retained for future instructor API work.
      properties:
        name:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        published:
          type: boolean
        type:
          type: string
        location:
          type: string
        newProblems:
          description: Problems to add or update as part of contest authoring.
          oneOf:
            - type: array
              items:
                type: object
                additionalProperties: true
            - type: object
              additionalProperties: true
      required:
        [name, starts_at, ends_at, published, type, location, newProblems]

    ProblemExampleRequest:
      type: object
      properties:
        id:
          type: string
        input:
          type: string
        output:
          type: string
        explanation:
          type: string
      required: [id, input, output, explanation]

    StarterCodesRequest:
      type: object
      properties:
        cplusplus:
          type: string
        java:
          type: string
        python:
          type: string
        typescript:
          type: string
        javascript:
          type: string
      required: [cplusplus, java, python, typescript, javascript]

    ProblemPatchRequest:
      type: object
      description: >
        Partial problem update payload. All fields are optional. Only included fields are
        applied. If tags, examples, or starterCodes are included, those collections are
        replaced with the provided values.
      minProperties: 1
      properties:
        title:
          type: string
        difficulty:
          type: string
          enum: [easy, medium, hard]
        points:
          type: integer
          minimum: 0
        tags:
          type: array
          items:
            type: string
        visibility:
          type: string
          enum: [course-only, public, private]
        statement:
          type: string
        inputFormat:
          type: string
        outputFormat:
          type: string
        constraints:
          type: string
        examples:
          type: array
          maxItems: 1
          items:
            $ref: "#/components/schemas/ProblemExampleRequest"
        starterCodes:
          $ref: "#/components/schemas/StarterCodesRequest"

    ContestPatchRequest:
      type: object
      description: >
        Partial contest update payload. All fields are optional. Only included fields are
        applied. If selectedProblemIds is included, contest problem links are replaced with
        the provided ordered list. If any schedule field is updated, the persisted schedule
        is recalculated from the merged start/end values.
      minProperties: 1
      properties:
        contestName:
          type: string
        description:
          type: string
        startDate:
          type: string
          example: "2026-03-24"
        startTime:
          type: string
          example: "09:30"
        endDate:
          type: string
          example: "2026-03-24"
        endTime:
          type: string
          example: "11:00"
        visibility:
          type: string
          enum: [course-only, public, private]
        aiHintEnabled:
          type: boolean
        selectedProblemIds:
          type: array
          minItems: 1
          items:
            type: string

    EntityUpdateResponse:
      type: object
      properties:
        id:
          type: string
      required: [id]

    AddUserRequest:
      type: object
      description: Planned add-user contract retained for future instructor API work.
      properties:
        username:
          type: string
        password:
          type: string
      required: [username, password]

    InstructorSubmitRequest:
      type: object
      description: Planned instructor test-run submission contract retained for future API work.
      properties:
        filecode:
          type: string
        textcode:
          type: string
        language:
          type: string
        connection_id:
          type: string
      required: [language]
      oneOf:
        - required: [filecode]
        - required: [textcode]

    JudgeResultRequest:
      type: object
      properties:
        sid:
          type: string
        status:
          type: string
        judge_output:
          type: string
        score:
          type: number
        connection_id:
          type: string
      required: [sid, status, judge_output, score, connection_id]

    JudgeCallbackResponse:
      type: object
      properties:
        ok:
          type: boolean
        target:
          type: string
          enum: [contest, practice]
        status:
          type: string
        error:
          type: string
      required: [ok]

    ContestStatusSyncResponse:
      type: object
      properties:
        ok:
          type: boolean
        checked:
          type: integer
        updated:
          type: integer
        timestamp:
          type: string
          format: date-time
      required: [ok, checked, updated, timestamp]

    ReportAiHintRequest:
      type: object
      description: Planned AI hint callback contract retained for future system API work.
      properties:
        code:
          type: string
        feedback:
          type: string
        validation:
          type: string
        connection_id:
          type: string
        is_job_successful:
          type: boolean
      required: [code, feedback, validation, connection_id, is_job_successful]
